# ~/.config/systemd/user/gamescope-session.service.d/50-gmstream.conf
# Game Mode's gamescope draws into gmstream instead of driving the display
# (see ~/gmstream/session/gamescope-session). Delete this file to go back to
# stock Game Mode.
[Unit]
Requires=gmstream.service
After=gmstream.service

[Service]
ExecStart=
ExecStart=%h/gmstream/session/gamescope-session
