[package]
name = "gmstream"
version = "0.1.0"
edition = "2024"
description = "SteamOS Game Mode streaming server: gamescope host, VA-API encoder, WebTransport"
license = "MIT"

[dependencies]
anyhow = "1"
libc = "0.2"
rcgen = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "macros", "time", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
wtransport = { version = "0.7", features = ["quinn"] }

[build-dependencies]
cc = "1"

[profile.release]
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

[dev-dependencies]
wtransport = { version = "0.7", features = ["quinn", "dangerous-configuration"] }
